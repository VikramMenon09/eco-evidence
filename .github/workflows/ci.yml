name: Verify research toolkit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/eco-wheels" .
          python -m pip install --no-deps "$RUNNER_TEMP"/eco-wheels/eco_evidence-*.whl
      - name: Exercise the installed command outside the checkout
        run: python -I scripts/check_installed.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s automation -p 'test_*.py' -v
