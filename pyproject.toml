[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-evidence"
dynamic = ["version"]
description = "Reproducible World Bank and NOAA evidence bundles for environmental economics research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eco-evidence = "eco_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["eco_evidence*"]

[tool.setuptools.dynamic]
version = {attr = "eco_evidence.__version__"}
